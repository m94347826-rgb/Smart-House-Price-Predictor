<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>House Price Predictor</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { margin: 10px; padding: 8px; width: 200px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Smart House Price Predictor</h2>
        <form action="/predict" method="POST">
            <input type="number" name="sqft" placeholder="House Area (sqft)" required><br>
            <input type="number" name="bedrooms" placeholder="Number of Bedrooms" required><br>
            <button type="submit">Predict Price</button>
        </form>
        {% if prediction_text %}
            <h3 style="color: #007bff; margin-top: 20px;">{{ prediction_text }}</h3>
        {% endif %}
    </div>
</body>
</html>
